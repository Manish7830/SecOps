name: SecOps Pipeline

on:
  repository_dispatch:
    types:
      - application_push

permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # Stage 1: Secret Scanning
  # ============================================================
  gitleaks:
    name: Gitleaks - Secret Scanning
    runs-on: ubuntu-latest

    steps:

      - name: Display Received Application Information
        run: |
          echo "SecOps Repo received Application trigger"
          echo "Application Repository: ${{ github.event.client_payload.repository }}"
          echo "Application Branch: ${{ github.event.client_payload.branch }}"
          echo "Application Commit SHA: ${{ github.event.client_payload.commit_sha }}"

      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application

      - name: Verify Checked Out Commit
        run: |
          echo "Application Source Successfully checked out"
          echo "Checked Out Commit SHA:"
          git -C application rev-parse HEAD

      - name: Scan Application for Secrets
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source=/repo \
            --no-git \
            --no-banner \
            --report-format json \
            --report-path /repo/gitleaks-report.json \
            --exit-code 1

      - name: Show Detected Secrets
        if: always()
        run: |
          echo "Gitleaks Findings:"
          echo "====================================="

          if [ -f "application/gitleaks-report.json" ]; then
            cat application/gitleaks-report.json | jq -r '
              .[] |
              "File: \(.File)\nLine: \(.StartLine)\nRule: \(.RuleID)\nSecret: \(.Match)\nCommit: \(.Commit // "N/A")\n---"
            '
          else
            echo "No report file found."
          fi

      - name: List Scanned Files
        run: |
          echo "Files Inside Gitleaks Scanning Scope:"
          echo "====================================="
          find application -type f -print


  # ============================================================
  # Stage 2: SonarQube Code Quality
  # ============================================================
  sonarqube-scan:
    name: SonarQube - Code Quality & Smell
    runs-on: self-hosted
    needs: gitleaks

    steps:

      - name: Display Received Application Information
        run: |
          echo "Running SonarQube analysis"
          echo "Application Repository: ${{ github.event.client_payload.repository }}"
          echo "Application Branch: ${{ github.event.client_payload.branch }}"
          echo "Application Commit SHA: ${{ github.event.client_payload.commit_sha }}"

      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application

      - name: Verify Checked Out Commit
        run: |
          echo "Application source checked out"
          echo "Checked Out Commit SHA:"
          git -C application rev-parse HEAD

      # ------------------------------------------------------------
      # SonarQube Health Check
      # ------------------------------------------------------------
      - name: Wait for Local SonarQube Server to be Ready
        run: |
          echo "Checking SonarQube server availability at http://13.61.253.200:9000//"

          for i in $(seq 1 30); do

            STATUS=$(curl -s \
              --max-time 5 \
              http://13.61.253.200:9000//api/system/status \
              | grep -o '"status":"[A-Z]*"' || true)

            echo "Attempt $i: $STATUS"

            if echo "$STATUS" | grep -q '"status":"UP"'; then
              echo "SonarQube is UP."
              exit 0
            fi

            sleep 5

          done

          echo "SonarQube did not become ready in time."
          exit 1

      # ------------------------------------------------------------
      # Backend SonarQube Scan
      # ------------------------------------------------------------
      - name: Scan Backend Code and Wait for Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm \
            --network host \
            -v "${GITHUB_WORKSPACE}/application/backend:/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.projectKey=hireflow-backend \
            -Dsonar.projectName=hireflow-backend \
            -Dsonar.sources=/usr/src \
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/** \
            -Dsonar.host.url=http://13.61.253.200:9000// \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

      # ------------------------------------------------------------
      # Frontend SonarQube Scan
      # Uncomment if frontend analysis is required
      # ------------------------------------------------------------
      #
      # - name: Scan Frontend Code and Wait for Quality Gate
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   run: |
      #     docker run --rm \
      #       --network host \
      #       -v "${GITHUB_WORKSPACE}/application/frontend:/usr/src" \
      #       sonarsource/sonar-scanner-cli:latest \
      #       -Dsonar.projectKey=hireflow-frontend \
      #       -Dsonar.projectName=hireflow-frontend \
      #       -Dsonar.sources=/usr/src \
      #       -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/** \
      #       -Dsonar.host.url=http://13.61.253.200:9000// \
      #       -Dsonar.token="$SONAR_TOKEN" \
      #       -Dsonar.qualitygate.wait=true

      - name: Show SonarQube Dashboard Links
        if: always()
        run: |
          echo "====================================="
          echo "SonarQube Analysis Complete"
          echo "====================================="
          echo "Backend Dashboard:"
          echo "http://13.61.253.200:9000//dashboard?id=hireflow-backend"


  # ============================================================
  # Stage 3: Dependency Scanning
  # ============================================================
  trivy-deps:
    name: Trivy - Dependency Scanning
    runs-on: ubuntu-latest
    needs: sonarqube-scan

    steps:

      - name: Display Received Application Information
        run: |
          echo "SecOps Repo received Application trigger for dependency scan"
          echo "Application Repository: ${{ github.event.client_payload.repository }}"
          echo "Application Branch: ${{ github.event.client_payload.branch }}"
          echo "Application Commit SHA: ${{ github.event.client_payload.commit_sha }}"

      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application

      - name: Verify Checked Out Commit
        run: |
          echo "Application Source Successfully checked out"
          git -C application rev-parse HEAD

      - name: Scan Dependencies for Vulnerabilities
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            fs \
            /repo \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format table \
            --exit-code 1

      - name: Generate JSON Report of Findings
        if: always()
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            fs \
            /repo \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format json \
            --output /repo/trivy-fs-report.json \
            --exit-code 0

      - name: Show Vulnerability Summary
        if: always()
        run: |
          echo "Trivy Dependency Findings:"
          echo "====================================="

          if [ -f "application/trivy-fs-report.json" ]; then

            cat application/trivy-fs-report.json | jq -r '
              .Results[]? |
              select(.Vulnerabilities != null) |
              .Vulnerabilities[] |
              "Package: \(.PkgName)\nInstalled: \(.InstalledVersion)\nFixed In: \(.FixedVersion // "N/A")\nSeverity: \(.Severity)\nCVE: \(.VulnerabilityID)\n---"
            '

          else
            echo "No report file found."
          fi

      - name: Upload Trivy FS Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dependency-report
          path: application/trivy-fs-report.json


  # ============================================================
  # Stage 4: Backend Build, Scan & Push
  # ============================================================
  build-scan-push-backend:
    name: Backend - Build, Scan & Push
    runs-on: ubuntu-latest
    needs: trivy-deps

    steps:

      - name: Display Received Application Information
        run: |
          echo "Building backend image"
          echo "Commit: ${{ github.event.client_payload.commit_sha }}"

      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application

      - name: Verify Checked Out Commit
        run: |
          git -C application rev-parse HEAD

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            -f application/backend/Dockerfile \
            application/backend

      - name: Scan Backend Image for Vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            image \
            hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            --severity CRITICAL,HIGH \
            --format table \
            --exit-code 1

      - name: Generate JSON Report of Backend Image Findings
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            -v "${GITHUB_WORKSPACE}:/output" \
            aquasec/trivy:latest \
            image \
            hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            --severity CRITICAL,HIGH \
            --format json \
            --output /output/trivy-backend-report.json \
            --exit-code 0

      - name: Show Backend Vulnerability Summary
        if: always()
        run: |
          echo "Trivy Backend Image Findings:"
          echo "====================================="

          if [ -f "trivy-backend-report.json" ]; then

            cat trivy-backend-report.json | jq -r '
              .Results[]? |
              select(.Vulnerabilities != null) |
              .Vulnerabilities[] |
              "Package: \(.PkgName)\nInstalled: \(.InstalledVersion)\nFixed In: \(.FixedVersion // "N/A")\nSeverity: \(.Severity)\nCVE: \(.VulnerabilityID)\n---"
            '

          else
            echo "No report found."
          fi

      - name: Upload Backend Trivy Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-image-report
          path: trivy-backend-report.json

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Backend Image to GHCR
        run: |
          IMAGE_NAME=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/hireflow-backend

          docker tag \
            hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            ${IMAGE_NAME}:${{ github.event.client_payload.commit_sha }}

          docker tag \
            hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            ${IMAGE_NAME}:latest

          docker push ${IMAGE_NAME}:${{ github.event.client_payload.commit_sha }}
          docker push ${IMAGE_NAME}:latest


  # ============================================================
  # Stage 5: Frontend Build, Scan & Push
  # ============================================================
  build-scan-push-frontend:
    name: Frontend - Build, Scan & Push
    runs-on: ubuntu-latest
    needs: trivy-deps

    steps:

      - name: Display Received Application Information
        run: |
          echo "Building frontend image"
          echo "Commit: ${{ github.event.client_payload.commit_sha }}"

      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application

      - name: Verify Checked Out Commit
        run: |
          git -C application rev-parse HEAD

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t hireflow-frontend:${{ github.event.client_payload.commit_sha }} \
            -f application/frontend/Dockerfile \
            --build-arg VITE_API_URL=${{ vars.VITE_API_URL }} \
            application/frontend

      - name: Scan Frontend Image for Vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            image \
            hireflow-frontend:${{ github.event.client_payload.commit_sha }} \
            --severity CRITICAL,HIGH \
            --format table \
            --exit-code 1

      - name: Generate JSON Report of Frontend Image Findings
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            -v "${GITHUB_WORKSPACE}:/output" \
            aquasec/trivy:latest \
            image \
            hireflow-frontend:${{ github.event.client_payload.commit_sha }} \
            --severity CRITICAL,HIGH \
            --format json \
            --output /output/trivy-frontend-report.json \
            --exit-code 0

      - name: Show Frontend Vulnerability Summary
        if: always()
        run: |
          echo "Trivy Frontend Image Findings:"
          echo "====================================="

          if [ -f "trivy-frontend-report.json" ]; then

            cat trivy-frontend-report.json | jq -r '
              .Results[]? |
              select(.Vulnerabilities != null) |
              .Vulnerabilities[] |
              "Package: \(.PkgName)\nInstalled: \(.InstalledVersion)\nFixed In: \(.FixedVersion // "N/A")\nSeverity: \(.Severity)\nCVE: \(.VulnerabilityID)\n---"
            '

          else
            echo "No report found."
          fi

      - name: Upload Frontend Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-image-report
          path: trivy-frontend-report.json

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Frontend Image to GHCR
        run: |
          IMAGE_NAME=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/hireflow-frontend

          docker tag \
            hireflow-frontend:${{ github.event.client_payload.commit_sha }} \
            ${IMAGE_NAME}:${{ github.event.client_payload.commit_sha }}

          docker tag \
            hireflow-frontend:${{ github.event.client_payload.commit_sha }} \
            ${IMAGE_NAME}:latest

          docker push ${IMAGE_NAME}:${{ github.event.client_payload.commit_sha }}
          docker push ${IMAGE_NAME}:latest